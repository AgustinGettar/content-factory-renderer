name: Lumi App recovery manager V1

on:
  push:
    branches: [lumi-app-recovery-manager-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-provider-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax and migration validation
        run: |
          node --check server.js
          node --check lib/lumi-recovery-incident-manager-v1.js
          node --check test/lumi-recovery-incident-manager-v1.test.js
          node --check test/lumi-recovery-server-integration.test.js
      - name: Recovery, Telegram and pipeline regression
        run: node --test test/lumi-recovery-incident-manager-v1.test.js test/lumi-recovery-server-integration.test.js test/lumi-second-short-runtime.test.js test/lumi-editorial-readiness-v1.test.js test/render-profiles.test.js
      - name: Confirm provider-free implementation
        run: |
          test "$(grep -R "provider_calls: 0" -c lib/lumi-recovery-incident-manager-v1.js)" -ge 1
          ! grep -R "setImmediate.*runZeroProviderRecoveryDryRun" server.js
