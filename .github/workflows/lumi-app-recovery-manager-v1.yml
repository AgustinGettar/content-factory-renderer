name: Lumi App recovery manager V1

on:
  push:
    branches: [lumi-app-recovery-manager-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-provider-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax and migration validation
        run: |
          node --check server.js
          node --check lib/lumi-third-shot-pack-runtime-v1.js
          node --check lib/lumi-third-shot-pack-design-v1.js
          node --check lib/lumi-recovery-incident-manager-v1.js
          node --check lib/lumi-staging-dry-run-on-boot.js
          node --check test/lumi-recovery-incident-manager-v1.test.js
          node --check test/lumi-staging-dry-run-on-boot.test.js
          node --check test/lumi-recovery-server-integration.test.js
      - name: Recovery, Telegram and pipeline regression
        run: node --test test/lumi-recovery-incident-manager-v1.test.js test/lumi-staging-dry-run-on-boot.test.js test/lumi-recovery-server-integration.test.js test/lumi-second-short-runtime.test.js test/lumi-editorial-readiness-v1.test.js test/render-profiles.test.js
      - name: Artifact-specific q34 Human Review and no-provider RESUME
        run: node --import ./scripts/director-offline-guard.mjs --test test/lumi-remaining-director-contract.test.js test/lumi-q34-human-resume.test.js test/lumi-series-v2-gates.test.js test/lumi-cinematic-director-human-assembly.test.js
      - name: Shot pack and USD accounting gates
        run: node --test test/lumi-third-shot-pack-v1.test.js test/lumi-third-shot-pack-runtime-v1.test.js test/higgsfield-usd-budget-v1.test.js
      - name: Confirm provider-free implementation
        run: |
          test "$(grep -R "provider_calls: 0" -c lib/lumi-recovery-incident-manager-v1.js)" -ge 1
          grep -q 'PROVIDER_CALLS_ALLOWED !== "0"' server.js
          grep -q '127.0.0.1' lib/lumi-staging-dry-run-on-boot.js
