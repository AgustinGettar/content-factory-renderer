name: Lumi pilot CI validation

on:
  push:
    branches: [lumi-pilot-ci-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check changed JavaScript syntax
        run: |
          node --check server.js
          node --check lib/lumi-pilot-internal.js
          node --check lib/lumi-production-pilot-boot.js
          node --check lib/lumi-pilot-repair.js
          node --check test/lumi-pilot-internal.test.js
          node --check test/lumi-pilot-repair.test.js
      - name: Focused Lumi pilot tests
        run: node --test test/lumi-production-pilot-v1.test.js test/lumi-pilot-internal.test.js test/lumi-pilot-repair.test.js test/security.test.js
      - name: Relevant AV2 and renderer regression
        run: node --test test/asset-engine-v2.test.js test/asset-visual-qa-v12.test.js test/av2-hardening.test.js test/render-profiles.test.js
# repair-gate
# boot-shape-fix
