name: Lumi Telegram review V1
on:
  push:
    branches: [lumi-telegram-review-v1, lumi-app-recovery-manager-v1, lumi-telegram-make-transport-v1, lumi-production-readiness-v2, lumi-elevenlabs-tts-v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zero-provider-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Select focused library or supervised recovery validation
        id: scope
        shell: bash
        run: |
          editorial_only=true
          policy_ui_only=true
          policy_ui_test=false
          draft_only=true
          fluid_only=true
          library_only=true
          recovery_only=true
          direct_only=true
          one_tap_only=true
          docs_only=true
          startup_only=true
          publication_only=true
          git rev-parse HEAD^ >/dev/null 2>&1 || { library_only=false; recovery_only=false; direct_only=false; one_tap_only=false; }
          while IFS= read -r path; do
            case "$path" in
              lib/telegram-mini-app/editor-store.js|lib/telegram-mini-app/editor-media.js|lib/telegram-mini-app/results.js|test/lumi-visual-editor.test.js|test/lumi-visual-editor-browser.mjs|test/lumi-results.test.js|lib/lumi-editorial-timeline-v2.js|lib/lumi-third-short-master-v1.js|lib/lumi-generic-v2-adapter.js|lib/lumi-recovery-incident-manager-v1.js|lib/lumi-v2-executor-bindings.js|lib/lumi-v2-input-materializer.js|lib/lumi-v2-telegram-runtime.js|lib/telegram-mini-app/preparation.js|lib/telegram-mini-app/runtime.js|lib/telegram-mini-app/metricool.js|public/lumi-studio/*|test/fixtures/generic-v2.js|test/lumi-generic-runtime-integration.test.js|test/lumi-editorial-timeline-v2.test.js|test/lumi-q41-first-image.test.js|test/lumi-recovery-incident-manager-v1.test.js|test/lumi-stabilization-assembly.test.js|test/lumi-metricool.test.js|docs/*|.github/workflows/lumi-telegram-review-v1.yml) ;;
              *) editorial_only=false ;;
            esac
            case "$path" in
              lib/telegram-mini-app/runtime.js|lib/telegram-mini-app/metricool.js|lib/telegram-mini-app/publication-store.js|public/lumi-studio/*|test/lumi-metricool.test.js|test/lumi-publication-browser.mjs|docs/LUMI_PUBLICATION_AND_PROVIDER_STATUS.md|docs/LUMI_PROMPT_FEEDBACK.md|docs/LUMI_RESUME_STATE.md|docs/lumi-improvement/state.json|.github/workflows/lumi-telegram-review-v1.yml) ;;
              *) publication_only=false ;;
            esac
            case "$path" in
              lib/telegram-review-v1/core.js|lib/telegram-mini-app/auth.js|lib/telegram-mini-app/runtime.js|lib/telegram-mini-app/publication.js|lib/higgsfield-funding.js|lib/generative-video-benchmark-v1.js|lib/lumi-series-v2-execution.js|lib/lumi-v2-telegram-runtime.js|lib/lumi-recovery-incident-manager-v1.js|public/lumi-studio/*|test/lumi-fluid-ux.test.js|test/lumi-publication-and-provider-status.test.js|test/lumi-mini-app-auth.test.js|test/lumi-q41-first-image.test.js|test/lumi-*-browser.mjs|docs/LUMI_STUDIO_STARTUP.md|docs/LUMI_PUBLICATION_AND_PROVIDER_STATUS.md|docs/LUMI_FUNDING_NOTICE.md|.github/workflows/lumi-telegram-review-v1.yml) ;;
              *) startup_only=false ;;
            esac
            case "$path" in
              public/lumi-studio/app.js|lib/telegram-mini-app/runtime.js|test/lumi-q41-first-image.test.js|test/lumi-policy-control-browser.mjs|docs/*|.github/workflows/lumi-telegram-review-v1.yml) ;;
              *) policy_ui_only=false ;;
            esac
            [ "$path" != test/lumi-policy-control-browser.mjs ] || policy_ui_test=true
            case "$path" in
              lib/provider-emission-journal-v1.js|lib/lumi-v2-*.js|lib/lumi-stage-result-v2.js|lib/lumi-series-v2-gates.js|lib/lumi-generic-v2-adapter.js|lib/cinematic-director-v1/*|lib/telegram-mini-app/q41-policy.js|lib/telegram-mini-app/runtime.js|public/lumi-studio/app.js|test/lumi-q41-first-image.test.js|test/lumi-fluid-ux.test.js|test/lumi-preflight-continuation-sql.test.js|supabase/migrations/*_lumi_fenced_preflight_continuation.sql|docs/*|docs/lumi-improvement/*|.github/workflows/lumi-telegram-review-v1.yml) ;;
              *) draft_only=false ;;
            esac
            case "$path" in
              public/lumi-studio/*|lib/lumi-v2-telegram-runtime.js|lib/telegram-mini-app/q41-policy.js|lib/telegram-mini-app/runtime.js|lib/telegram-mini-app/library.js|test/lumi-policy-control-browser.mjs|test/lumi-daily-workflow-browser.mjs|test/lumi-fluid*|test/lumi-mini-app-auth.test.js|test/lumi-library-v1.test.js|test/lumi-q41-first-image.test.js|package.json|package-lock.json|docs/lumi-improvement/*|docs/LUMI_RESUME_STATE.md|docs/LUMI_PROMPT_FEEDBACK.md|docs/LUMI_NEXT_PROMPT.txt|docs/LUMI_FLUID_UX.md|.github/workflows/lumi-telegram-review-v1.yml) ;;
              *) fluid_only=false ;;
            esac
            case "$path" in docs/*) ;; *) docs_only=false ;; esac
            case "$path" in
              lib/higgsfield-usd-budget-v1.js|lib/lumi-stage-result-v2.js|lib/lumi-v2-activation-context.js|lib/lumi-v2-execution-orchestrator.js|lib/telegram-mini-app/library.js|lib/lumi-improvement-loop.js|test/lumi-stage-result-v2.test.js|test/higgsfield-usd-budget-v1.test.js|test/lumi-mini-app-auth.test.js|docs/LUMI_PRODUCTION_RECOVERY.md|lib/lumi-supervised-activation.js|lib/lumi-supervised-replacement.js|lib/lumi-v2-telegram-runtime.js|lib/telegram-mini-app/q41-policy.js|lib/telegram-mini-app/runtime.js|public/lumi-studio/app.js|supabase/migrations/*_lumi_one_tap_proposal_revision.sql|test/lumi-q41-first-image.test.js|test/lumi-supervised-activation.test.js|test/lumi-supervised-replacement.test.js|docs/lumi-improvement/*|docs/LUMI_RESUME_STATE.md|docs/LUMI_PROMPT_FEEDBACK.md|docs/LUMI_NEXT_PROMPT.txt|.github/workflows/lumi-telegram-review-v1.yml) ;;
              *) one_tap_only=false ;;
            esac
            case "$path" in
              server.js|lib/telegram-review-v1/direct-transport.js|lib/telegram-review-v1/runtime.js|lib/telegram-review-v1/make-transport.js|lib/telegram-mini-app/auth.js|lib/telegram-mini-app/runtime.js|lib/lumi-recovery-incident-manager-v1.js|lib/lumi-improvement-loop.js|test/lumi-direct-telegram.test.js|scripts/lumi-telegram-cutover.mjs|supabase/migrations/*_lumi_direct_telegram_transport.sql|docs/LUMI_DIRECT_TELEGRAM.md|docs/lumi-telegram-mini-app-v1.md|docs/recovery/*|docs/lumi-improvement/*|docs/LUMI_RESUME_STATE.md|docs/LUMI_PROMPT_FEEDBACK.md|docs/LUMI_NEXT_PROMPT.txt|.github/workflows/lumi-telegram-review-v1.yml) ;;
              *) direct_only=false ;;
            esac
            case "$path" in
              lib/telegram-mini-app/library.js|lib/telegram-mini-app/runtime.js|public/lumi-studio/app.js|public/lumi-studio/style.css|test/lumi-library-v1.test.js|supabase/migrations/*_lumi_reusable_asset_library_v1.sql|supabase/migrations/*_lumi_library_discovery_v1.sql|docs/LUMI_REUSABLE_ASSET_LIBRARY_V1.md|docs/LUMI_INTELLIGENT_LIBRARY.md|.github/workflows/lumi-telegram-review-v1.yml) ;;
              *) library_only=false ;;
            esac
            case "$path" in
              lib/higgsfield-usd-budget-v1.js|lib/provider-emission-journal-v1.js|test/higgsfield-usd-budget-v1.test.js|test/provider-emission-journal-v1.test.js|test/lumi-q41-first-image.test.js|test/lumi-recovery-incident-manager-v1.test.js|test/lumi-generic-balance-recovery.test.js|supabase/migrations/*_lumi_cost_traceability.sql|docs/LUMI_COST_RELIABILITY.md|lib/lumi-supervised-activation.js|lib/lumi-supervised-runtime-bindings.js|lib/lumi-v2-telegram-runtime.js|lib/lumi-v2-input-materializer.js|lib/lumi-stage-result-v2.js|test/lumi-supervised-activation.test.js|test/lumi-stage-result-v2.test.js|test/lumi-generic-runtime-integration.test.js|supabase/migrations/*_lumi_supervised_replacement_activation.sql|supabase/migrations/*_lumi_supervised_durable_consent.sql|lib/lumi-supervised-replacement.js|lib/lumi-recovery-incident-manager-v1.js|lib/lumi-improvement-loop.js|lib/telegram-mini-app/runtime.js|public/lumi-studio/app.js|test/lumi-supervised-replacement.test.js|scripts/lumi-improvement-loop.mjs|docs/lumi-improvement/*|docs/LUMI_RESUME_STATE.md|docs/LUMI_PROMPT_FEEDBACK.md|docs/LUMI_NEXT_PROMPT.txt|docs/LUMI_SUPERVISED_RECOVERY.md|.github/workflows/lumi-telegram-review-v1.yml) ;;
              *) recovery_only=false ;;
            esac
          done < <(git diff --name-only HEAD^ HEAD)
          echo "editorial_only=$editorial_only" >> "$GITHUB_OUTPUT"
          echo "publication_only=$publication_only" >> "$GITHUB_OUTPUT"
          if [ "$publication_only" = true ]; then startup_only=true; fi
          if [ "$startup_only" = true ]; then
            fluid_only=true; policy_ui_only=false; policy_ui_test=false; draft_only=false; library_only=false; recovery_only=false; direct_only=false; one_tap_only=false
          fi
          echo "startup_only=$startup_only" >> "$GITHUB_OUTPUT"
          if [ "$policy_ui_test" != true ]; then policy_ui_only=false; fi
          if [ "$policy_ui_only" = true ]; then
            draft_only=false; fluid_only=false; library_only=false; recovery_only=false; direct_only=false; one_tap_only=false
          fi
          echo "policy_ui_only=$policy_ui_only" >> "$GITHUB_OUTPUT"
          echo "draft_only=$draft_only" >> "$GITHUB_OUTPUT"
          echo "fluid_only=$fluid_only" >> "$GITHUB_OUTPUT"
          echo "library_only=$library_only" >> "$GITHUB_OUTPUT"
          echo "recovery_only=$recovery_only" >> "$GITHUB_OUTPUT"
          echo "direct_only=$direct_only" >> "$GITHUB_OUTPUT"
          echo "one_tap_only=$one_tap_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install media inspection dependency
        if: steps.scope.outputs.docs_only != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node --check server.js && node --check lib/telegram-mini-app/library.js && node --check lib/telegram-mini-app/runtime.js && node --check public/lumi-studio/app.js
      - name: Asset library, SQL, auth and protected production integration (offline)
        if: steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.policy_ui_only != 'true'
        run: node --import ./scripts/director-offline-guard.mjs --test test/lumi-library-v1.test.js test/lumi-mini-app-auth.test.js
      - name: Supervised recovery, budget, journal and durable continuation (offline)
        if: steps.scope.outputs.recovery_only == 'true' && steps.scope.outputs.one_tap_only != 'true'
        run: |
          node --check lib/lumi-supervised-activation.js && node --check lib/lumi-supervised-runtime-bindings.js
          node --import ./scripts/director-offline-guard.mjs --test test/lumi-supervised-activation.test.js test/lumi-stage-result-v2.test.js test/lumi-generic-runtime-integration.test.js test/lumi-materialization-v2.test.js test/lumi-supervised-replacement.test.js test/lumi-recovery-incident-manager-v1.test.js test/provider-emission-journal-v1.test.js test/higgsfield-usd-budget-v1.test.js test/lumi-generic-balance-recovery.test.js
          node --import ./scripts/director-offline-guard.mjs --test --test-name-pattern="^(SUPERVISED|QUOTE_RENEWAL|QUOTED_EXECUTION|RESERVATION_BEFORE|ONETAP (AUTOMATIC_QUOTE|FINAL_RESERVATION|MAX_RESERVATION)|Q42_ONE_TAP MAX_RESERVATION)" test/lumi-q41-first-image.test.js
          node scripts/lumi-improvement-loop.mjs
          git diff --exit-code -- docs/LUMI_RESUME_STATE.md docs/LUMI_PROMPT_FEEDBACK.md docs/LUMI_NEXT_PROMPT.txt
      - name: Direct Telegram transport and affected regression only (offline)
        if: steps.scope.outputs.direct_only == 'true' && steps.scope.outputs.one_tap_only != 'true'
        run: |
          node --check lib/telegram-review-v1/direct-transport.js
          node --import ./scripts/director-offline-guard.mjs --test test/lumi-direct-telegram.test.js test/lumi-make-transport.test.js test/lumi-multipart-delivery.test.js
          node --import ./scripts/director-offline-guard.mjs --test --test-name-pattern="^(BUDGET_|ambiguous dispatch|request id is immutable|provider failure before|incident persists|FULL_EPISODE_COST_ESTIMATE|IMPROVEMENT|NEXT_PROMPT|INCIDENT|PROMPT_FEEDBACK|RESUME_STATE)" test/lumi-recovery-incident-manager-v1.test.js test/lumi-supervised-replacement.test.js
          node scripts/lumi-improvement-loop.mjs
          git diff --exit-code -- docs/LUMI_RESUME_STATE.md docs/LUMI_PROMPT_FEEDBACK.md docs/LUMI_NEXT_PROMPT.txt
      - name: Recovered one-tap, transactional limits and preserved transport (offline)
        if: steps.scope.outputs.one_tap_only == 'true' && steps.scope.outputs.docs_only != 'true' && steps.scope.outputs.fluid_only != 'true'
        run: |
          node --check lib/telegram-mini-app/q41-policy.js && node --check lib/lumi-v2-telegram-runtime.js
          node --import ./scripts/director-offline-guard.mjs --test test/lumi-supervised-activation.test.js test/lumi-supervised-replacement.test.js test/lumi-stage-result-v2.test.js test/lumi-direct-telegram.test.js test/higgsfield-usd-budget-v1.test.js test/provider-emission-journal-v1.test.js
          node --import ./scripts/director-offline-guard.mjs --test --test-name-pattern="^(DURABLE_SAVED_REVIEW_ACK|DURABLE_RESULT_RECOVERY|DURABLE_EPISODE_JOB|DURABLE_LOCAL_RESTART|PLAN_ONETAP|ONETAP |DURABLE_LOCK |Q42_ONE_TAP |READ_ONLY_PROGRESS|HUMAN_REVIEW |SUPERVISED|QUOTE_RENEWAL|QUOTED_EXECUTION|RESERVATION_BEFORE|MINI_MEDIA_ACCESS|MINI_END_TO_END_NON_GENERATIVE)" test/lumi-q41-first-image.test.js
          node --import ./scripts/director-offline-guard.mjs --test --test-name-pattern="^MULTI_EPISODE_INTEGRATION" test/lumi-q41-first-image.test.js
      - name: Fluid UI and deterministic private previews (offline)
        if: steps.scope.outputs.fluid_only == 'true' && steps.scope.outputs.docs_only != 'true'
        run: |
          node --import ./scripts/director-offline-guard.mjs --test test/lumi-fluid-ux.test.js
          node --import ./scripts/director-offline-guard.mjs --test --test-name-pattern="^(DRAFT_POLICY|PLAN_ONETAP|DURABLE_RESULT_RECOVERY|DURABLE_SAVED_REVIEW_ACK|HUMAN_REVIEW |MINI_MEDIA_ACCESS|MINI_END_TO_END_NON_GENERATIVE)" test/lumi-q41-first-image.test.js
      - name: Metricool connection and durable local drafts (no external effects)
        if: steps.scope.outputs.docs_only != 'true'
        run: node --import ./scripts/director-offline-guard.mjs --test test/lumi-metricool.test.js test/lumi-mini-app-auth.test.js
      - name: Startup reads, fresh auth, unchanged budget gates and local HTTP assets
        if: steps.scope.outputs.startup_only == 'true' && steps.scope.outputs.docs_only != 'true'
        run: |
          node --import ./scripts/director-offline-guard.mjs --test test/lumi-telegram-review-v1.test.js test/lumi-direct-telegram.test.js test/lumi-recovery-incident-manager-v1.test.js test/higgsfield-usd-budget-v1.test.js
          node --import ./scripts/director-offline-guard.mjs --test --test-name-pattern="^(STUDIO_STARTUP|READ_ONLY_PROGRESS|SHARED_IDENTITY|QUOTE_RENEWAL|QUOTED_EXECUTION|RESERVATION_BEFORE)" test/lumi-q41-first-image.test.js
          node --test --test-name-pattern="^STUDIO_STARTUP_HTTP" test/lumi-q41-first-image.test.js
          node --import ./scripts/director-offline-guard.mjs --test test/lumi-publication-and-provider-status.test.js test/generative-video-benchmark-v1.test.js test/generative-video-benchmark-v1-1.test.js test/provider-emission-journal-v1.test.js test/lumi-generic-balance-recovery.test.js
          node --import ./scripts/director-offline-guard.mjs --test --test-name-pattern="^(HIGGSFIELD_FUNDING|DURABLE_RESULT_RECOVERY|SHARED_IDENTITY|HUMAN_REVIEW )" test/lumi-q41-first-image.test.js
      - name: Browser fixtures and measured before-after rendering
        if: steps.scope.outputs.fluid_only == 'true' && steps.scope.outputs.docs_only != 'true'
        run: |
          git cat-file -e 079fae88e5188da574ca589e290e6c83afc161d7:public/lumi-studio/app.js || git fetch --no-tags --depth=1 origin 079fae88e5188da574ca589e290e6c83afc161d7
          npx playwright install --with-deps chromium
          node test/lumi-fluid-browser.mjs
          node test/lumi-policy-control-browser.mjs
          node test/lumi-daily-workflow-browser.mjs
          if [ "${{ steps.scope.outputs.publication_only }}" = true ]; then node test/lumi-publication-browser.mjs; fi
          if [ "${{ steps.scope.outputs.startup_only }}" = true ]; then node test/lumi-startup-browser.mjs; fi
      - name: Daily workflow screenshots
        if: always() && steps.scope.outputs.fluid_only == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lumi-daily-workflow-screens
          path: |
            /tmp/lumi-daily-screens/*.png
            /tmp/lumi-publication-screens/*.png
          if-no-files-found: ignore
      - name: Fenced preflight and explicit draft-policy affected regression (offline)
        if: steps.scope.outputs.draft_only == 'true' && steps.scope.outputs.docs_only != 'true'
        run: |
          node --import ./scripts/director-offline-guard.mjs --test test/lumi-preflight-continuation-sql.test.js test/provider-emission-journal-v1.test.js test/lumi-stage-result-v2.test.js test/lumi-series-v2-gates.test.js test/lumi-cinematic-director-v1.test.js test/lumi-mini-app-auth.test.js test/lumi-direct-telegram.test.js test/lumi-fluid-ux.test.js
          node --import ./scripts/director-offline-guard.mjs --test --test-name-pattern="^(PREPARED_CONTINUATION|DRAFT_POLICY|PLAN_ONETAP|DURABLE_EPISODE_JOB|DURABLE_RESULT_RECOVERY|READ_ONLY_PROGRESS|MINI_MEDIA_ACCESS|HUMAN_REVIEW |MULTI_EPISODE_INTEGRATION|AUTOMATIC_DRAFT_INTEGRATION)" test/lumi-q41-first-image.test.js
      - name: Policy controls during an accepted generation (offline browser)
        if: steps.scope.outputs.policy_ui_only == 'true'
        run: |
          node --import ./scripts/director-offline-guard.mjs --test test/lumi-mini-app-auth.test.js test/lumi-fluid-ux.test.js
          node --import ./scripts/director-offline-guard.mjs --test --test-name-pattern="^DRAFT_POLICY" test/lumi-q41-first-image.test.js
          npx playwright install --with-deps chromium
          node test/lumi-policy-control-browser.mjs
      - name: Shared production and recovery regression for editorial changes
        if: steps.scope.outputs.editorial_only == 'true' && steps.scope.outputs.docs_only != 'true'
        run: |
          node --import ./scripts/director-offline-guard.mjs --test test/lumi-fluid-ux.test.js test/lumi-generic-v2-adapter.test.js test/lumi-generic-runtime-integration.test.js test/lumi-materialization-v2.test.js test/lumi-stage-result-v2.test.js test/lumi-recovery-incident-manager-v1.test.js test/lumi-supervised-replacement.test.js test/provider-emission-journal-v1.test.js test/higgsfield-usd-budget-v1.test.js test/lumi-production-profile-v2.test.js test/lumi-direct-telegram.test.js
          node --import ./scripts/director-offline-guard.mjs --test --test-name-pattern="^(STUDIO_NEW_CHAPTER_INTEGRATION|STUDIO_STARTUP|DRAFT_POLICY|PLAN_ONETAP|DURABLE_RESULT_RECOVERY|DURABLE_SAVED_REVIEW_ACK|QUOTE_RENEWAL|QUOTED_EXECUTION|HIGGSFIELD_FUNDING|READ_ONLY_PROGRESS|PREPARED_CONTINUATION|DURABLE_LOCAL_RESTART|HUMAN_REVIEW |MINI_MEDIA_ACCESS)" test/lumi-q41-first-image.test.js
          node --test test/lumi-generic-runtime-restart.test.js
      - name: Natural timeline and Studio preparation (isolated media and browser)
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          node --import ./scripts/director-offline-guard.mjs --test test/lumi-editorial-timeline-v2.test.js test/lumi-stabilization-assembly.test.js
          npx playwright install --with-deps chromium
          LUMI_BROWSER_TEST=1 node --test --test-name-pattern="^(STUDIO_PREPARATION_BROWSER|STUDIO_STARTUP_HTTP)" test/lumi-q41-first-image.test.js
      - name: Visual editor, exact-version export and read-only analytics
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          node --import ./scripts/director-offline-guard.mjs --test test/lumi-visual-editor.test.js test/lumi-results.test.js
          node test/lumi-visual-editor-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumi-visual-editor-evidence
          path: |
            /tmp/lumi-visual-evidence/*.json
            /tmp/lumi-visual-browser-*/*.png
          if-no-files-found: ignore
      - name: Durable evidence documents reproduce exactly
        run: |
          node scripts/lumi-improvement-loop.mjs
          git diff --exit-code -- docs/LUMI_RESUME_STATE.md docs/LUMI_PROMPT_FEEDBACK.md docs/LUMI_NEXT_PROMPT.txt
      - name: Telegram, Recovery Manager and director regression with network disabled
        if: steps.scope.outputs.editorial_only != 'true' && steps.scope.outputs.policy_ui_only != 'true' && steps.scope.outputs.draft_only != 'true' && steps.scope.outputs.fluid_only != 'true' && steps.scope.outputs.library_only != 'true' && steps.scope.outputs.recovery_only != 'true' && steps.scope.outputs.direct_only != 'true' && steps.scope.outputs.one_tap_only != 'true'
        run: >-
          node --import ./scripts/director-offline-guard.mjs --test
          test/lumi-mini-app-auth.test.js
          test/lumi-telegram-review-v1.test.js
          test/lumi-make-transport.test.js
          test/lumi-panel-recovery.test.js
          test/lumi-multipart-delivery.test.js
          test/lumi-make-ux-concurrency.test.js
          test/lumi-source-planning-concurrency.test.js
          test/lumi-panel-renderer-v2.test.js
          test/lumi-production-profile-v2.test.js
          test/lumi-generic-v2-adapter.test.js
          test/lumi-generic-runtime-integration.test.js
          test/lumi-generic-balance-recovery.test.js
          test/lumi-isolated-validation.test.js
          test/lumi-isolated-tts-preflight.test.js
          test/lumi-fourth-episode-usd-preflight.test.js
          test/lumi-isolated-usd-preflight.test.js
          test/lumi-q41-source-bound-quote.test.js
          test/lumi-q41-first-image.test.js
