name: Lumi PAPER compact isolated CI
on:
  push:
    branches: [lumi-trading-compact-panel-shadow-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper-node-and-aws:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/trading-*.test.js test/secondary-*.test.js test/multi-pattern*.test.js test/lumi-direct-telegram.test.js test/lumi-mini-app-auth.test.js
      - run: python3 -m unittest discover -s test -p 'trading_aws_*_test.py' -v
