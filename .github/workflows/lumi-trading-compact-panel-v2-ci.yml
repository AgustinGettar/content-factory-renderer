name: Lumi Trading compact-panel v2 isolated checks
on:
  push:
    branches: [lumi-trading-compact-panel-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compact-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Full isolated paper regression + compact site contract
        run: node --test test/trading-*.test.js test/secondary-*.test.js test/multi-pattern*.test.js test/lumi-direct-telegram.test.js test/lumi-mini-app-auth.test.js
      - name: AWS installer regression (no deployment)
        run: python3 -m unittest discover -s test -p 'trading_aws_*_test.py' -v
      - name: Shell syntax
        run: bash -n deploy/trading/aws-bootstrap.sh
