<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light"><meta name="theme-color" content="#f5f6fa">
<meta name="referrer" content="same-origin"><title>Lumi Trading · Vista simple</title>
<style>
:root{font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",sans-serif;color:#17253b;background:#f5f6fa}
*{box-sizing:border-box}body{margin:0}button,a{touch-action:manipulation}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #4477e5;outline-offset:3px}
.shell{max-width:730px;margin:auto;padding:env(safe-area-inset-top,0px) 16px calc(90px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 0 24px}
h1{font-size:22px;line-height:1.1;margin:0;letter-spacing:-.6px}h2{font-size:16px;line-height:1.3;margin:0 0 12px;letter-spacing:-.25px}
h1 small{font-size:10px;background:#e6ecf6;color:#34466a;border-radius:6px;padding:4px 6px;vertical-align:middle;letter-spacing:.4px}
.tagline{font-size:12px;color:#647388;margin:6px 0 0}.full{background:#fff;color:#345b91;border:1px solid #dce2ee;border-radius:12px;padding:9px 10px;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
.status{display:inline-flex;margin:0 0 16px;padding:8px 10px;color:#276853;background:#dff3ea;border-radius:11px;font-size:12px}
.status.stale{color:#855117;background:#fff0d5}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:#fff;border:1px solid #e6eaf2;border-radius:15px;min-width:0;min-height:106px;padding:14px;display:flex;flex-direction:column;gap:6px}
.kpi-main{grid-column:1/-1;background:linear-gradient(130deg,#eef4ff,#fff);min-height:125px}
.kpi>span{font-size:12px;color:#5e6f86;display:block}
.kpi>strong{font-size:clamp(18px,5.3vw,26px);line-height:1.17;letter-spacing:-.6px;overflow-wrap:anywhere}
.kpi-main>strong{font-size:clamp(29px,8vw,38px)}
.kpi small{color:#7a8695;font-size:11px}.gain{color:#16775b!important}.loss{color:#af373d!important}.muted,.neutral{color:#617087!important}
.section{margin-top:26px}.subcopy{font-size:12px;color:#66758a;margin:-6px 0 10px}
.position,.frame,.history,.empty{background:#fff;border:1px solid #e6eaf2;border-radius:14px;padding:14px;margin-bottom:9px}
.position header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.pair{font-size:12px;font-weight:700;color:#4a5a73}
.side{font-size:12px;font-weight:700;border-radius:8px;padding:4px 8px}.short{background:#fbe9ee;color:#ad3455}.long{background:#e0f5ed;color:#13795b}
.position-top{display:flex;align-items:end;justify-content:space-between;gap:12px}
.position-top div{display:flex;flex-direction:column}.position-top strong{font-size:22px}.position-top small{font-size:11px;color:#6a7889}
.position-top>small{max-width:48%;text-align:right}
details{border-top:1px solid #eff0f4;margin-top:12px;padding-top:10px}
summary{cursor:pointer;color:#365c91;font-weight:650;font-size:13px;list-style:none}
summary::after{content:"⌄";float:right}details[open]>summary::after{content:"⌃"}
dl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}dl div{min-width:0}dt{font-size:11px;color:#6b7889}dd{margin:3px 0 0;font-size:13px;font-weight:700;overflow-wrap:anywhere}
details p{font-size:12px;line-height:1.6;color:#687587}
.frame-main{display:flex;align-items:center;gap:13px}.frame-main>strong{font-size:15px;background:#edf2fa;min-width:42px;text-align:center;border-radius:9px;padding:11px 7px}
.frame-main>div{min-width:0;display:flex;flex-direction:column;gap:3px}.frame-main b{font-size:13px;font-weight:600}.frame-main small,.history small{font-size:11px;color:#8491a1}
.history{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:5px}
.history>strong{font-size:16px}.history>small{width:100%}
.empty{color:#677589;font-size:13px;line-height:1.6}
.warning{font-size:12px;color:#86541a;background:#fff0d7;border-radius:8px;padding:9px;margin-top:8px}
.advanced details{background:#fff;border:1px solid #e6eaf2;border-radius:14px;padding:14px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;font-size:12px}
.hint{font-weight:800;font-size:10px;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;color:#567395;background:#e9eff8}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8eaf0;padding:9px max(12px,env(safe-area-inset-right,0px)) calc(9px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px}
.bottom button{border:0;background:transparent;color:#64748a;border-radius:10px;min-width:105px;padding:9px 10px;font-weight:700;font-size:12px}
.bottom button.active{color:#1755a5;background:#ebf3fe}
footer{font-size:11px;color:#8895a4;margin:28px 0 10px}
@media(max-width:360px){.shell{padding-left:12px;padding-right:12px}.bottom button{min-width:0;flex:1}}
@media(min-width:680px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kpi-main{grid-column:span 2}}
</style></head>
<body><div class="shell">
<header class="top"><div><h1>Lumi Trading <small>PAPER</small></h1><p class="tagline">La secundaria, sin ruido</p></div>
<a class="full" id="full-view" href="/">Vista completa</a></header>
<p class="status stale" id="status" role="status" aria-live="polite">Cargando datos privados…</p>
<main id="content"><p class="empty">Consultando el estado de Lumi. Si venció tu sesión, abrí el panel desde Telegram.</p></main>
<footer>Solo simulación · Esta vista no envía órdenes ni modifica balances.</footer>
</div>
<nav class="bottom" id="nav" aria-label="Secciones del panel">
<button type="button" data-view="resumen" class="active" aria-current="page">Resumen</button>
<button type="button" data-view="operaciones">Operaciones</button>
<button type="button" data-view="actividad">Actividad</button>
</nav>
<script type="module" src="./app.js"></script></body></html>
